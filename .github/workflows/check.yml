name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nginx shellcheck python3-venv
      - run: python3 -m venv /tmp/media-yandex && /tmp/media-yandex/bin/pip install -r requirements-yandex.txt
      - run: /tmp/media-yandex/bin/python -c 'from yandex_music import Client; assert callable(Client.device_auth)'
      - run: PYTHONPATH=app python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q app scripts
      - run: bash -n install.sh scripts/update.sh
      - run: shellcheck install.sh scripts/update.sh
